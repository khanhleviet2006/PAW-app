[project]
name = "paw-backend"
version = "0.1.0"
description = "PAW mobile GPS sensor backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "psycopg[binary]>=3.2,<4", "shapely>=2.0,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
imagery = [
    "mercantile>=1.2.1",
    "pillow>=13.0.0",
    "rasterio>=1.5.2",
]
[dependency-groups]
dev = [
    "mercantile>=1.2.1",
    "pillow>=13.0.0",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "rasterio>=1.5.2",
    "ruff>=0.9,<1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
